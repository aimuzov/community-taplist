# Production setup: docker compose up -d --build
# Host-specific tweaks (reverse proxy network, hiding the port) go into
# docker-compose.override.yml, which is git-ignored — see docs/deploy.md.

services:
  taplist:
    build:
      context: .
      # Build for the typical x86 server even when running compose on an arm64 machine.
      platforms:
        - linux/amd64
    image: community-taplist:latest
    container_name: taplist
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=96
    # The app needs ~100 MB; the limit keeps it from starving neighbours on a small VPS.
    mem_limit: 160m
    ports:
      - '${PORT:-3000}:3000'
